<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDS Design System Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a2e; }

  .topbar {
    background: #051766;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .topbar-sub { font-size: 12px; color: #57BBEB; }
  .topbar-right { display: flex; gap: 10px; }
  .btn-download {
    background: #57BBEB; color: #051766; border: none;
    padding: 8px 20px; border-radius: 99px; font-size: 13px;
    font-weight: 700; cursor: pointer; transition: background 0.15s;
  }
  .btn-download:hover { background: #77C8EF; }
  .btn-copy {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 20px; border-radius: 99px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .btn-copy:hover { background: rgba(255,255,255,0.1); }

  .layout { display: flex; height: calc(100vh - 52px); }

  /* 사이드바 */
  .sidebar {
    width: 240px; min-width: 240px; background: #fff;
    border-right: 1px solid #e8e8e8; overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-section { margin-bottom: 4px; }
  .sidebar-section-title {
    font-size: 10px; font-weight: 700; color: #a4a4a4;
    letter-spacing: 0.8px; text-transform: uppercase;
    padding: 8px 16px 4px;
  }
  .sidebar-item {
    display: block; width: 100%; text-align: left;
    padding: 7px 16px; font-size: 13px; color: #333;
    background: none; border: none; cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .sidebar-item:hover { background: #f7f7f7; color: #051766; }
  .sidebar-item.active {
    background: #EEF8FD; color: #051766; font-weight: 600;
    border-left-color: #051766;
  }

  /* 메인 에디터 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .editor-header {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 12px 24px; display: flex; align-items: center; gap: 12px;
  }
  .editor-section-label {
    font-size: 11px; color: #a4a4a4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .editor-title { font-size: 16px; font-weight: 700; color: #051766; }
  .editor-body { flex: 1; display: flex; overflow: hidden; }

  .editor-pane {
    flex: 1; display: flex; flex-direction: column; border-right: 1px solid #e8e8e8;
  }
  .pane-label {
    font-size: 11px; font-weight: 600; color: #a4a4a4;
    padding: 8px 16px; background: #fafafa; border-bottom: 1px solid #ebebeb;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  textarea {
    flex: 1; border: none; outline: none; resize: none;
    padding: 20px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px; line-height: 1.7; color: #333;
    background: #fff;
  }

  .preview-pane { flex: 1; overflow-y: auto; padding: 24px; background: #fafafa; }
  .preview-content h1 { font-size: 22px; font-weight: 700; color: #051766; margin: 0 0 16px; border-bottom: 2px solid #051766; padding-bottom: 8px; }
  .preview-content h2 { font-size: 18px; font-weight: 700; color: #051766; margin: 24px 0 12px; }
  .preview-content h3 { font-size: 15px; font-weight: 700; color: #374585; margin: 18px 0 8px; }
  .preview-content h4 { font-size: 14px; font-weight: 700; color: #051766; margin: 14px 0 6px; border-left: 3px solid #57BBEB; padding-left: 8px; }
  .preview-content p { font-size: 14px; line-height: 1.7; color: #333; margin: 0 0 10px; }
  .preview-content ul, .preview-content ol { padding-left: 20px; margin: 0 0 10px; }
  .preview-content li { font-size: 14px; line-height: 1.7; color: #333; margin: 2px 0; }
  .preview-content code { background: #f0f0f0; padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #051766; }
  .preview-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .preview-content th { background: #E6E7EF; color: #051766; font-weight: 600; padding: 7px 10px; text-align: left; border: 1px solid #D9D9D9; }
  .preview-content td { padding: 6px 10px; border: 1px solid #D9D9D9; color: #333; }
  .preview-content tr:nth-child(even) td { background: #f7f7f7; }
  .preview-content hr { border: none; border-top: 1px solid #D9D9D9; margin: 16px 0; }
  .preview-content blockquote { border-left: 3px solid #57BBEB; padding: 8px 12px; background: #EEF8FD; margin: 10px 0; border-radius: 0 6px 6px 0; }
  .preview-content strong { font-weight: 700; color: #051766; }

  .changed-badge {
    display: inline-block; background: #DA291C; color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 99px; margin-left: 6px; vertical-align: middle;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #252525CC; color: #fff; padding: 10px 20px;
    border-radius: 99px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="topbar-logo">WDS Design System</div>
      <div class="topbar-sub">Wing Design System — Claude용 MD 에디터</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-copy" onclick="copyAll()">전체 복사</button>
    <button class="btn-download" onclick="downloadMD()">MD 다운로드</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="editor-header">
      <div>
        <div class="editor-section-label" id="sectionLabel">섹션</div>
        <div class="editor-title" id="editorTitle">항목을 선택하세요</div>
      </div>
    </div>
    <div class="editor-body">
      <div class="editor-pane">
        <div class="pane-label">✏️ 편집</div>
        <textarea id="editor" placeholder="좌측에서 섹션을 선택하세요" oninput="onEdit()"></textarea>
      </div>
      <div class="preview-pane">
        <div class="pane-label">👁 미리보기</div>
        <div class="preview-content" id="preview"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  { group: "3.6 카드 & 컨테이너", items: ["Bottom Card","Content Visual Card","Image Card","Logo Card","Related Card","Data Box","Content Data Box","Image-text Box","Text Box","Boarding Pass","Voucher"] },
  { group: "3.7 리스트 & 테이블", items: ["List","Listbox","Data Table","Board List","Board View","Link Group","Order List","Order List Tab"] },
  { group: "3.8 복합 & 도메인", items: ["Accordion","Expander","Carousel (Swiper)","Load More","Chart","Itinerary","FromTo","Passenger","Class"] },

// 컴포넌트 기본 템플릿
function getComponentTemplate(name) {
  const templates = {
    "Button": `#### Button\n\n**정의**\n사용자가 특정 액션을 실행하는 가장 기본적인 인터랙션 요소.\n\n**목적**\n- 예약, 검색, 결제 등 명확한 액션을 트리거한다.\n- 시각적 계층을 통해 주요/보조/파괴적 액션을 구분한다.\n\n**Variants**\n| Property | Values |\n|----------|--------|\n| Type | \`solid\`, \`ghost\`, \`text-only\` |\n| Size | \`lg\`, \`md\`, \`sm\` |\n| State | \`default\`, \`hover\`, \`pressed\`, \`disabled\`, \`loading\` |\n\n**토큰 매핑**\n| Variant | Background | Text | Radius |\n|---------|-----------|------|--------|\n| Solid | \`color/fill/interaction/primary\` (#051766) | \`color/text/inverse\` (#FFFFFF) | \`radius/button\` (24px) |\n| Ghost | transparent | \`color/text/body\` (#051766) | \`radius/button\` (24px) |\n| Disabled | \`color/fill/interaction/disabled\` (#D9D9D9) | \`color/text/disabled\` (#A4A4A4) | \`radius/button\` (24px) |\n\n**Size 스펙**\n| Size | Height | Font |\n|------|--------|------|\n| LG | 56px | \`body-lg-bold\` |\n| MD | 48px | \`body-md-bold\` |\n| SM | 36px | \`body-sm-bold\` |\n\n**Usage**\n- ✅ 레이블은 동사형으로 작성한다\n- ✅ Solid Primary는 한 화면에 1개만 사용한다\n- ❌ 단순 페이지 이동에는 Link 컴포넌트를 사용한다\n\n**접근성**\n- \`<button>\` 태그, \`type="button"\` 명시\n- Disabled: \`aria-disabled="true"\`\n- 최소 터치 영역: 44×44px`,
  };
  if (templates[name]) return templates[name];
  return `#### ${name}\n\n**정의**\n<!-- 이 컴포넌트의 목적과 역할을 작성해주세요 -->\n\n**목적**\n- \n\n**Variants**\n| Property | Values |\n|----------|--------|\n| | |\n\n**토큰 매핑**\n| 요소 | 토큰 |\n|------|------|\n| | |\n\n**Usage**\n- ✅ \n- ❌ \n\n**접근성**\n- `;
}

// 컴포넌트 섹션을 sections에 추가
componentGroups.forEach(group => {
  sections.push({
    group: group.group,
    items: group.items.map(name => ({
      id: 'comp-' + name.replace(/\s+/g,'-').toLowerCase(),
      label: name,
      content: getComponentTemplate(name)
    }))
  });
});

// 4. Design Rules
sections.push({
  group: "4. Design Rules",
  items: [
    { id: "rules-token", label: "토큰 사용 규칙", content: `## 4.1 토큰 사용 규칙

- 임의의 hex 값을 컴포넌트에 직접 사용하지 않는다.` },
    { id: "rules-combo", label: "컴포넌트 조합 규칙", content: `## 4.2 컴포넌트 조합 규칙

- Dialog + Bottom Sheet: 동시 표시 불가
- Snack Bar: 동시에 1개만 표시
- Nudge: 동시에 1개만 표시

    { id: "rules-a11y", label: "접근성 필수 규칙", content: `## 4.3 접근성 필수 규칙

    { id: "rules-i18n", label: "다국어 & 반응형", content: `## 4.4 다국어 지원 규칙
- 기본 폰트: Hanjin Group Sans (한국어)

- 중국어 간체: Microsoft YaHei / 번체: Microsoft JhengHei
- 텍스트 길이 변화에 대응하는 유연한 레이아웃을 사용한다

## 4.5 반응형 규칙
- 모바일 (375px~): compact 타이포그래피, 4컬럼 그리드
- 태블릿 (768px~): 8컬럼 그리드
- 웹 (980px~): 16컬럼 그리드, wide 타이포그래피

  ]
});

// ── 상태 관리 ──────────────────────────────────────────────────
const edits = {}; // id → 수정된 내용
let currentId = null;

function getContent(id) {
  const all = sections.flatMap(s => s.items);
  const item = all.find(i => i.id === id);
  return edits[id] !== undefined ? edits[id] : (item ? item.content : '');
}

function onEdit() {
  const val = document.getElementById('editor').value;
  edits[currentId] = val;
  renderPreview(val);
  updateSidebarBadge(currentId);
}

function selectItem(id) {
  currentId = id;
  const all = sections.flatMap(s => s.items);
  const item = all.find(i => i.id === id);
  if (!item) return;

  // 사이드바 active
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`)?.classList.add('active');

  // 헤더 업데이트
  const groupName = sections.find(s => s.items.some(i => i.id === id))?.group || '';
  document.getElementById('sectionLabel').textContent = groupName;
  document.getElementById('editorTitle').textContent = item.label;

  // 에디터 내용
  const content = getContent(id);
  document.getElementById('editor').value = content;
  renderPreview(content);
}

function updateSidebarBadge(id) {
  const btn = document.querySelector(`[data-id="${id}"]`);
  if (!btn) return;
  const orig = sections.flatMap(s=>s.items).find(i=>i.id===id)?.content;
  const cur = edits[id];
  let badge = btn.querySelector('.changed-badge');
  if (cur !== undefined && cur !== orig) {
    if (!badge) { badge = document.createElement('span'); badge.className = 'changed-badge'; badge.textContent = '수정'; btn.appendChild(badge); }
  } else {
    badge?.remove();
  }
}

// ── MD 렌더링 ──────────────────────────────────────────────────
function renderPreview(md) {
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- ✅ (.+)$/gm, '<li style="color:#28794E">✅ $1</li>')
    .replace(/^- ❌ (.+)$/gm, '<li style="color:#DA291C">❌ $1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>');

  // 테이블 처리
  html = html.replace(/((?:\|.+\|\n?)+)/g, match => {
    const rows = match.trim().split('\n').filter(r => r.trim());
    let table = '<table>';
    rows.forEach((row, i) => {
      if (row.match(/^\|[-| ]+\|$/)) return;
      const cells = row.split('|').filter((_,j,a) => j>0 && j<a.length-1);
      if (i === 0) {
        table += '<tr>' + cells.map(c=>`<th>${c.trim()}</th>`).join('') + '</tr>';
      } else {
        table += '<tr>' + cells.map(c=>`<td>${c.trim()}</td>`).join('') + '</tr>';
      }
    });
    table += '</table>';
    return table;
  });

  // li 그룹화
  html = html.replace(/(<li.*?<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
  // 줄바꿈
  html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');

  document.getElementById('preview').innerHTML = `<div>${html}</div>`;
}

// ── 사이드바 렌더링 ──────────────────────────────────────────────
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sections.forEach(section => {
    const div = document.createElement('div');
    div.className = 'sidebar-section';
    div.innerHTML = `<div class="sidebar-section-title">${section.group}</div>`;
    section.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-item';
      btn.textContent = item.label;
      btn.dataset.id = item.id;
      btn.onclick = () => selectItem(item.id);
      div.appendChild(btn);
    });
    sidebar.appendChild(div);
  });
}

// ── 전체 MD 조합 ──────────────────────────────────────────────
function buildFullMD() {
  let md = `# WDS (Wing Design System)\n> Korean Air (대한항공) 공식 디자인 시스템. 이 문서를 기반으로 새로운 컴포넌트를 생성하거나 테마를 적용할 때는 반드시 아래 토큰과 규칙을 따라야 한다.\n\n---\n\n`;

  sections.forEach(section => {
    section.items.forEach(item => {
      md += getContent(item.id) + '\n\n---\n\n';
    });
  });
  return md;
}

function downloadMD() {
  const md = buildFullMD();
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wds-design-system.md';
  a.click();
  showToast('MD 파일이 다운로드되었어요!');
}

function copyAll() {
  const md = buildFullMD();
  navigator.clipboard.writeText(md).then(() => showToast('전체 내용이 복사되었어요!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 초기화
renderSidebar();
// 첫 항목 선택
selectItem(sections[0].items[0].id);
</script>
